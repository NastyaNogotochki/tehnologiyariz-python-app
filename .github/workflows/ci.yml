name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install flake8 pytest
          pip install -e .

      - name: Check code
        run: flake8 myapp tests --count --select=E9,F63,F7,F82

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t my-python-app .
